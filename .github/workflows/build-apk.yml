name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Publier l'APK (branche apk)
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk out/fdm-volley.apk
          echo "Build ${GITHUB_RUN_NUMBER} - ${GITHUB_SHA::7} - $(date -u +%FT%TZ)" > out/VERSION.txt
          cd out
          git init -q && git checkout -q -b apk
          git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "APK build ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk

      - uses: actions/upload-artifact@v4
        with:
          name: fdm-volley-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publier le journal en cas d'échec (branche build-log)
        if: failure()
        run: |
          mkdir logout && cp build.log logout/ 2>/dev/null || echo "pas de journal" > logout/build.log
          cd logout
          git init -q && git checkout -q -b build-log
          git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "log ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-log
